<svg xmlns="http://www.w3.org/2000/svg" width="520" height="540" viewBox="0 0 520 540" role="img" aria-labelledby="title desc"><title id="title">플레이하며 바꾼 것</title><desc id="desc">설명 도식. 조준 지연, 점프 착지, 늦은 폭발음의 문제와 개선 방향을 비교. 전체 입력 지연 정밀 측정 없음.</desc><style>text{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#173b32}.kicker{font-size:17px;font-weight:700;letter-spacing:2px}.title{font-size:30px;font-weight:800}.label{font-size:23px;font-weight:750}.body{font-size:20px}.muted{fill:#527269}.arrow{fill:none;stroke:#527269;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.card{fill:#f6faf8;stroke:#c4ded2;stroke-width:2}.number{font-size:17px;fill:#527269;font-weight:700}</style><rect width="520" height="540" rx="24" fill="#e8f3ed"/><text class="kicker" x="24" y="36">GAMEMIX / EXPLAINED</text><text class="title" x="24" y="75">플레이하며 바꾼 것</text>
<rect class="card" x="24" y="100" width="472" height="122" rx="14"/><text class="label" x="40" y="135">조준 지연</text><text class="body muted" x="40" y="170">일반 OCR · 오래된 시선</text><text class="body" x="40" y="202">→ 보정된 판독 · 새 프레임 기준 전달</text>
<rect class="card" x="24" y="239" width="472" height="122" rx="14"/><text class="label" x="40" y="274">점프 착지</text><text class="body muted" x="40" y="309">두 게임의 이동 범위 · 지형 차이</text><text class="body" x="40" y="341">→ 이동 차이 누적 · 블록 충돌 보정</text>
<rect class="card" x="24" y="378" width="472" height="122" rx="14"/><text class="label" x="40" y="413">늦은 폭발음</text><text class="body muted" x="40" y="448">마크 명중 이후 원본 로켓 폭발</text><text class="body" x="40" y="480">→ 시그마 흡수 · 명중 시 표본 재생</text>
<text class="muted" x="260" y="526" text-anchor="middle" style="font-size:17px">실플레이 반복 확인 · 전체 입력 지연 정밀 측정 없음</text>
</svg>