<svg xmlns="http://www.w3.org/2000/svg" width="520" height="540" viewBox="0 0 520 540" role="img" aria-labelledby="title desc"><title id="title">연결한 기능</title><desc id="desc">설명 도식. 이동·지형, 사격·로켓, 생체장·근접, 피격·복귀 연결. 원본 체력바 연결 확인, 응답성 개선은 중단.</desc><style>text{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#173b32}.kicker{font-size:17px;font-weight:700;letter-spacing:2px}.title{font-size:30px;font-weight:800}.label{font-size:23px;font-weight:750}.body{font-size:20px}.muted{fill:#527269}.arrow{fill:none;stroke:#527269;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.card{fill:#f6faf8;stroke:#c4ded2;stroke-width:2}.number{font-size:17px;fill:#527269;font-weight:700}</style><rect width="520" height="540" rx="24" fill="#e8f3ed"/><text class="kicker" x="24" y="36">GAMEMIX / EXPLAINED</text><text class="title" x="24" y="75">연결한 기능</text>
<rect class="card" x="24" y="100" width="472" height="80" rx="14"/><text class="number" x="40" y="128">01</text><text class="label" x="83" y="131">이동·지형</text><text class="body muted" x="40" y="160">벽 충돌 · 한 블록 · 점프 · 낙하</text>
<rect class="card" x="24" y="196" width="472" height="80" rx="14"/><text class="number" x="40" y="224">02</text><text class="label" x="83" y="227">사격·로켓</text><text class="body muted" x="40" y="256">몹 피해 · 지형 차단 · 명중음 재생</text>
<rect class="card" x="24" y="292" width="472" height="80" rx="14"/><text class="number" x="40" y="320">03</text><text class="label" x="83" y="323">생체장·근접</text><text class="body muted" x="40" y="352">E 회복 · 근접 타격 연결</text>
<rect class="card" x="24" y="388" width="472" height="80" rx="14"/><text class="number" x="40" y="416">04</text><text class="label" x="83" y="419">피격·복귀</text><text class="body muted" x="40" y="448">몹 반격 · 논리적 패배 → 5초 뒤 복귀</text>
<rect x="24" y="485" width="472" height="38" rx="10" fill="#f2e5d5"/><text x="260" y="510" text-anchor="middle" class="body" style="fill:#775131;font-weight:700">원본 체력바 / 응답성 개선 중단</text>
</svg>